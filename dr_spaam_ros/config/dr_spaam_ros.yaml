dr_spaam_ros_node:
  ros__parameters:
    # weight_file: "/home/sasm/self_supervised_person_detection/ckpt_jrdb_ann_drow3_e40.pth"
    # detector_model: "DROW3" # DROW3 or DR-SPAAM
    weight_file: "/home/steven/self_supervised_person_detection/ckpt_jrdb_ann_dr_spaam_e20.pth"
    detector_model: "DR-SPAAM" # DROW3 or DR-SPAAM
    conf_thresh: 0.95
    stride: 1 # use this to skip laser points
    panoramic_scan: True # Set to true if the scan covers 360 degree

    world_frame: "map"

    # detections are tracked between scans in world_frame: each person keeps an id
    # and their heading follows the direction they walk
    tracking:
      max_association_dist: 0.8 # [m] max distance between predicted and detected position
      timeout: 1.0 # [s] a person (and their id) is kept this long after the last detection
      velocity_smoothing_time: 0.5 # [s] time constant of the velocity filter, 0 = raw
      min_speed: 0.3 # [m/s] slower people count as standing: zero velocity, heading kept
      min_hits: 3 # people are only published once detected in this many consecutive scans
